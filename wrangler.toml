name = "kitbaglabs"
main = "worker/index.ts"
compatibility_date = "2025-01-01"

# Build the site before every deploy (local or Cloudflare git builds) so dist/ always exists.
[build]
command = "npm run build"

[assets]
directory = "dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Run the worker first for /api/*; everything else is served straight from assets.
run_worker_first = ["/api/*"]

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

[[send_email]]
name = "EMAIL"

[vars]
CONTACT_TO = "support@kitbaglabs.com"
CONTACT_FROM = "support@kitbaglabs.com"
